<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 650" width="320" height="650">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000020;stop-opacity:1" />
    </linearGradient>
    <style>
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .circle-group { animation: rotate 20s linear infinite; transform-origin: center; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  <g class="circle-group" transform="translate(160, 325)">
    <circle r="120" fill="none" stroke="#ff0000" stroke-width="4" opacity="0.7" />
    <circle r="100" fill="none" stroke="#ff7f00" stroke-width="4" opacity="0.7" />
    <circle r="80" fill="none" stroke="#ffff00" stroke-width="4" opacity="0.7" />
    <circle r="60" fill="none" stroke="#00ff00" stroke-width="4" opacity="0.7" />
    <circle r="40" fill="none" stroke="#0000ff" stroke-width="4" opacity="0.7" />
    <circle r="20" fill="none" stroke="#4b0082" stroke-width="4" opacity="0.7" />
  </g>
  <text x="160" y="550" fill="white" font-family="Arial" font-size="24" text-anchor="middle">Bringing rainbows into your home</text>
</svg>